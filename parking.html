<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>运营总览 - 智慧园区综合管理平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://modao.cc/agent-py/static/source/js/iconify-icon.min.1.0.7.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <link rel="stylesheet" href="css/pages/operator.css">
</head>
<body class="bg-slate-50 font-sans text-slate-900">
    <header class="h-16 bg-white border-b border-slate-200 fixed top-0 left-0 right-0 z-50">
        <div class="flex items-center justify-between h-full px-6">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center">
                    <iconify-icon icon="solar:map-point-wave-bold-duotone" class="text-white text-2xl"></iconify-icon>
                </div>
                <div>
                    <h1 class="font-bold text-lg">智慧园区综合管理平台</h1>
                    <div class="text-xs text-slate-400">运营总览 · 实时指挥中心</div>
                </div>
            </div>
            <nav class="hidden md:flex gap-2">
                <a class="px-3 py-2 rounded-md text-slate-500 hover:bg-slate-100" href="index.html">态势感知</a>
                <a class="px-3 py-2 rounded-md text-slate-500 hover:bg-slate-100" href="parking.html">智慧停车</a>
                <a class="px-3 py-2 rounded-md text-slate-500 hover:bg-slate-100" href="facilities.html">公共设施</a>
                <a class="px-3 py-2 rounded-md text-blue-600 bg-blue-50" href="operator.html">运营总览</a>
            </nav>
            <div class="flex items-center gap-4">
                <div class="text-right">
                    <div class="text-sm font-semibold" id="current-date"></div>
                    <div class="text-xs text-slate-400">实时监控中</div>
                </div>
                <div class="w-8 h-8 rounded-full bg-slate-200 overflow-hidden">
                    <img alt="avatar" src="https://modao.cc/agent-py/media/generated_images/2026-04-23/75e8608342ab439794accfed0a2e78b1.jpg">
                </div>
            </div>
        </div>
    </header>

    <main class="pt-20 p-6">
        <section class="grid grid-cols-1 gap-4 mb-6 md:grid-cols-4">
            <div class="bg-white rounded-xl p-4 shadow-sm border-l-4 border-blue-500 stat-card">
                <div class="text-xs text-slate-500">实时人数</div>
                <div class="text-2xl font-bold" id="stat-people">-</div>
            </div>
            <div class="bg-white rounded-xl p-4 shadow-sm border-l-4 border-emerald-500 stat-card">
                <div class="text-xs text-slate-500">车辆入园</div>
                <div class="text-2xl font-bold" id="stat-vehicles">-</div>
            </div>
            <div class="bg-white rounded-xl p-4 shadow-sm border-l-4 border-red-500 stat-card">
                <div class="text-xs text-slate-500">当前告警</div>
                <div class="text-2xl font-bold text-red-600" id="stat-alarms">0</div>
            </div>
            <div class="bg-white rounded-xl p-4 shadow-sm border-l-4 border-green-500 stat-card">
                <div class="text-xs text-slate-500">系统健康</div>
                <div class="text-2xl font-bold text-green-600" id="stat-health">正常</div>
            </div>
        </section>

        <section class="grid grid-cols-1 gap-6 mb-6 lg:grid-cols-3">
            <div class="bg-white rounded-xl p-4 shadow-sm lg:col-span-2">
                <h3 class="font-bold mb-3">关键指标趋势</h3>
                <div id="main-chart" class="h-64"></div>
                <div class="grid grid-cols-1 gap-3 mt-4 md:grid-cols-3">
                    <div class="bg-slate-50 rounded-lg p-2">
                        <div class="text-xs text-slate-500">车位利用率</div>
                        <div id="chart-usage" class="h-20"></div>
                    </div>
                    <div class="bg-slate-50 rounded-lg p-2">
                        <div class="text-xs text-slate-500">人流密度</div>
                        <div id="chart-flow" class="h-20"></div>
                    </div>
                    <div class="bg-slate-50 rounded-lg p-2">
                        <div class="text-xs text-slate-500">能耗趋势</div>
                        <div id="chart-energy" class="h-20"></div>
                    </div>
                </div>
            </div>

            <aside class="bg-white rounded-xl p-4 shadow-sm">
                <div class="flex justify-between items-center mb-3">
                    <h4 class="font-bold">告警列表</h4>
                    <button id="refresh-alarms" class="text-xs text-blue-600 hover:text-blue-700">刷新</button>
                </div>
                <div id="alarms-list" class="space-y-2 max-h-96 overflow-auto custom-scrollbar"></div>
                <button id="ack-all-alarms" class="w-full mt-4 bg-blue-600 text-white py-2 rounded-lg text-sm hover:bg-blue-700 transition">
                    确认所有告警
                </button>
            </aside>
        </section>

        <section class="bg-white rounded-xl p-4 shadow-sm">
            <h4 class="font-bold mb-3">运维控制</h4>
            <div class="flex flex-wrap gap-3">
                <button id="check-ai" class="px-4 py-2 bg-indigo-50 text-indigo-600 rounded-lg text-sm hover:bg-indigo-100 transition">检测 AI 连通</button>
                <button id="run-ai-detect" class="px-4 py-2 bg-orange-50 text-orange-600 rounded-lg text-sm hover:bg-orange-100 transition">AI 检测停车位</button>
                <button id="refresh-data" class="px-4 py-2 bg-slate-100 rounded-lg text-sm hover:bg-slate-200 transition">刷新所有数据</button>
                <div id="operation-result" class="text-sm text-slate-500 ml-2 flex items-center"></div>
            </div>
        </section>
    </main>

    <div id="ai-dialog" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40">
        <div class="w-11/12 md:w-2/3 lg:w-1/2 bg-white rounded-lg p-4 shadow-lg max-h-[80vh] overflow-hidden">
            <div class="flex items-center justify-between mb-3">
                <h3 class="font-semibold">AI 停车位判定结果</h3>
                <button id="ai-close" class="text-slate-500 hover:text-slate-700">关闭</button>
            </div>
            <div id="ai-results" class="overflow-auto custom-scrollbar space-y-3" style="max-height:65vh"></div>
        </div>
    </div>

    <button
        id="ai-chat-toggle"
        class="fixed bottom-6 right-6 z-40 flex h-14 w-14 items-center justify-center rounded-full bg-blue-600 text-white shadow-lg shadow-blue-200 transition hover:bg-blue-700"
        title="AI 助手"
        type="button">
        <iconify-icon icon="solar:chat-round-dots-bold-duotone" class="text-3xl"></iconify-icon>
    </button>

    <section
        id="ai-chat-panel"
        class="fixed bottom-24 right-6 z-40 hidden w-[min(420px,calc(100vw-32px))] overflow-hidden rounded-xl border border-slate-200 bg-white shadow-2xl">
        <header class="flex items-center justify-between border-b border-slate-100 px-4 py-3">
            <div>
                <h3 class="text-sm font-semibold">DeepSeek AI 助手</h3>
                <p class="text-xs text-slate-400">停车与运营问题实时问答</p>
            </div>
            <button id="ai-chat-close" class="rounded p-1 text-slate-500 hover:bg-slate-100 hover:text-slate-700" type="button">
                <iconify-icon icon="solar:close-circle-linear" class="text-xl"></iconify-icon>
            </button>
        </header>
        <div id="ai-chat-messages" class="custom-scrollbar max-h-[420px] min-h-72 space-y-3 overflow-y-auto bg-slate-50 p-4">
            <div class="max-w-[86%] rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm text-slate-700">
                你好，我可以帮你分析停车告警、车位状态、运营指标，也可以生成处理建议。
            </div>
        </div>
        <footer class="border-t border-slate-100 bg-white p-3">
            <div class="flex gap-2">
                <textarea
                    id="ai-chat-input"
                    class="max-h-28 min-h-10 flex-1 resize-none rounded-lg border border-slate-200 px-3 py-2 text-sm outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-100"
                    placeholder="输入问题，例如：当前停车风险有哪些？"
                    rows="1"></textarea>
                <button id="ai-chat-send" class="rounded-lg bg-blue-600 px-4 py-2 text-sm text-white hover:bg-blue-700" type="button">发送</button>
            </div>
        </footer>
    </section>

    <script src="js/pages/parking.js"></script>
</body>
</html>
