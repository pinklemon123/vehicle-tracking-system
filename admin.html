<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>围栏管理 · 智慧园区</title>
    
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/map.css">
    <link rel="stylesheet" href="css/pages/admin.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 高德地图安全密钥 -->
    <script type="text/javascript">
        window._AMapSecurityConfig = {
            securityJsCode: '599657ffe9617d6cca3ea60654912bb9',
        }
    </script>
</head>
<body class="admin-page">
    <!-- 地图容器 -->
    <div id="mapContainer" class="map-container"></div>
    
    <!-- 顶部导航 -->
    <header class="admin-header">
        <div class="header-left">
            <a href="index.html" class="back-link">
                <i class="fas fa-arrow-left"></i> 返回仪表盘
            </a>
            <h1><i class="fas fa-draw-polygon"></i> 围栏管理</h1>
        </div>
        
        <!-- 地点搜索框 -->
        <div class="header-search">
            <div class="search-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" id="placeSearchInput" placeholder="搜索地点... 例如：天安门、北京大学" autocomplete="off">
            </div>
            <div id="searchResults" class="search-results" style="display: none;"></div>
        </div>
        
        <div class="header-right">
            <span class="coord-badge" id="coordDisplay">
                <i class="fas fa-map-pin"></i> 116.397428, 39.90923
            </span>
        </div>
    </header>
    
    <!-- 左侧工具面板 - 围栏绘制 -->
    <aside class="admin-sidebar">
        <!-- 围栏绘制工具 -->
        <div class="tool-card primary">
            <div class="card-header">
                <i class="fas fa-pen-ruler"></i>
                <span>围栏绘制工具</span>
            </div>
            <div class="card-body">
                <!-- 绘制模式 -->
                <div class="mode-switch">
                    <button class="mode-btn active" data-mode="polygon">
                        <i class="fas fa-vector-square"></i> 多边形
                    </button>
                    <button class="mode-btn" data-mode="circle">
                        <i class="fas fa-circle"></i> 圆形
                    </button>
                </div>
                
                <!-- 操作按钮 -->
                <div class="action-group">
                    <button class="btn btn-success" id="startDrawBtn">
                        <i class="fas fa-play"></i> 开始绘制
                    </button>
                    <button class="btn btn-warning" id="finishDrawBtn" style="display: none;">
                        <i class="fas fa-check"></i> 完成
                    </button>
                    <button class="btn btn-danger" id="clearFenceBtn">
                        <i class="fas fa-trash"></i> 清除围栏
                    </button>
                </div>
                
                <!-- 绘制提示 -->
                <div id="drawHint" class="hint-box" style="display: none;">
                    <i class="fas fa-info-circle"></i>
                    <span>点击地图添加顶点，至少3个点完成围栏</span>
                </div>
            </div>
        </div>
        
        <!-- 围栏信息 -->
        <div class="tool-card" id="fenceInfoCard" style="display: none;">
            <div class="card-header">
                <i class="fas fa-info-circle"></i>
                <span>围栏信息</span>
            </div>
            <div class="card-body">
                <div class="info-grid">
                    <div class="info-item">
                        <span class="label">顶点数</span>
                        <span class="value" id="fencePointsCount">0</span>
                    </div>
                    <div class="info-item">
                        <span class="label">面积</span>
                        <span class="value" id="fenceArea">0 m²</span>
                    </div>
                    <div class="info-item">
                        <span class="label">周长</span>
                        <span class="value" id="fencePerimeter">0 m</span>
                    </div>
                    <div class="info-item">
                        <span class="label">围栏内车辆</span>
                        <span class="value highlight" id="fenceVehiclesCount">0</span>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 围栏内车辆列表 -->
        <div class="tool-card" id="fenceVehiclesCard" style="display: none;">
            <div class="card-header">
                <i class="fas fa-bicycle"></i>
                <span>围栏内车辆</span>
                <span class="badge" id="fenceVehiclesBadge">0</span>
            </div>
            <div class="card-body">
                <div class="vehicle-mini-list" id="fenceVehiclesList">
                    <!-- 动态渲染 -->
                </div>
            </div>
        </div>
        
        <!-- 车辆快速列表 -->
        <div class="tool-card">
            <div class="card-header">
                <i class="fas fa-list"></i>
                <span>所有车辆</span>
                <span class="badge" id="adminVehicleCount">0</span>
            </div>
            <div class="card-body">
                <div class="vehicle-mini-list" id="allVehiclesList">
                    <!-- 动态渲染 -->
                </div>
            </div>
            <div class="card-footer">
                <button class="btn btn-outline btn-sm btn-block" id="addVehicleBtn">
                    <i class="fas fa-plus"></i> 添加车辆
                </button>
            </div>
        </div>
    </aside>
    
    <!-- 右侧地图控件 -->

  <!-- admin.html 底部状态栏改为包含所有控件 -->
    <!-- 底部控制栏 -->
    <div class="admin-footer">
        <div class="footer-left">
            <span class="status-badge online">
                <i class="fas fa-wifi"></i> 已连接
            </span>
            <span class="status-badge">
                <i class="fas fa-map-marked-alt"></i> <span id="mapZoomLevel">13</span>级
            </span>
        </div>
        
        <div class="footer-center">
            <!-- 地图控件移到此处 -->
            <div class="footer-map-controls">
                <button class="map-ctrl-btn" id="locateBtn" title="我的位置">
                    <i class="fas fa-location-dot"></i>
                    <span>我的位置</span>
                </button>
                <button class="map-ctrl-btn" id="trafficBtn" title="路况">
                    <i class="fas fa-traffic-light"></i>
                    <span>路况</span>
                </button>
                <button class="map-ctrl-btn" id="satelliteBtn" title="卫星图">
                    <i class="fas fa-satellite"></i>
                    <span>卫星</span>
                </button>
                <button class="map-ctrl-btn" id="fitAllBtn" title="显示全部车辆">
                    <i class="fas fa-expand"></i>
                    <span>显示全部</span>
                </button>
            </div>
        </div>
        
        <div class="footer-right">
            <button class="btn btn-outline btn-sm" id="saveFenceBtn">
                <i class="fas fa-save"></i> 保存围栏
            </button>
        </div>
    </div>
    
    <!-- 添加车辆模态框 -->
    <div id="addVehicleModal" class="modal-overlay" style="display: none;">
        <div class="modal">
            <div class="modal-header">
                <h3><i class="fas fa-plus-circle"></i> 添加车辆</h3>
                <button class="modal-close" onclick="closeAddVehicleModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>车辆名称</label>
                    <input type="text" id="newVehicleName" class="form-control" placeholder="例如：自行车001">
                </div>
                <div class="form-group">
                    <label>车辆编号</label>
                    <input type="text" id="newVehiclePlate" class="form-control" placeholder="例如：BJ001">
                </div>
                <div class="form-group">
                    <label>初始位置</label>
                    <div class="coord-input">
                        <input type="text" id="newVehicleLng" class="form-control" placeholder="经度" readonly>
                        <input type="text" id="newVehicleLat" class="form-control" placeholder="纬度" readonly>
                    </div>
                    <span class="hint-text">点击地图选择位置</span>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeAddVehicleModal()">取消</button>
                <button class="btn btn-primary" id="confirmAddVehicleBtn">确认添加</button>
            </div>
        </div>
    </div>
    
    <!-- 通知容器 -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- 脚本 -->
    <script src="js/core/config.js"></script>
    <script src="js/core/utils.js"></script>
    <script src="js/core/eventBus.js"></script>
    <script src="js/map/mapLoader.js"></script>
    <script src="js/map/mapCore.js"></script>
    <script src="js/modules/vehicleManager.js"></script>
    <script src="js/modules/fenceManager.js"></script>
    <script src="js/modules/alarmManager.js"></script>
    <script src="js/services/apiService.js"></script>
    <script src="js/pages/admin.js"></script>
</body>
</html>
