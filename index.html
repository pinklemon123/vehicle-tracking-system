<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧园区 · 仪表盘</title>
    
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages/dashboard.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dashboard-page">
    <!-- 侧边导航栏 -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <i class="fas fa-microchip"></i>
            <span>智慧园区</span>
        </div>
        
        <nav class="sidebar-nav">
            <a href="index.html" class="nav-item active">
                <i class="fas fa-chart-pie"></i>
                <span>仪表盘</span>
            </a>
            <a href="admin.html" class="nav-item">
                <i class="fas fa-draw-polygon"></i>
                <span>围栏管理</span>
            </a>
            <a href="parking.html" class="nav-item">
                <i class="fas fa-parking"></i>
                <span>智慧停车</span>
            </a>
            <a href="facilities.html" class="nav-item">
                <i class="fas fa-map-signs"></i>
                <span>公共设施</span>
            </a>
            <a href="operator.html" class="nav-item">
                <i class="fas fa-chart-line"></i>
                <span>运营总览</span>
            </a>
        </nav>
        
        <div class="sidebar-footer">
            <div class="system-info">
                <span class="status-dot success"></span>
                <span>系统运行中</span>
            </div>
            <div class="version">v2.0.0</div>
        </div>
    </aside>
    
    <!-- 主内容区 -->
    <main class="main-content">
        <!-- 顶部栏 -->
        <header class="dashboard-header">
            <div class="page-title">
                <h1>仪表盘</h1>
                <span class="date-display" id="currentDate"></span>
            </div>
            <div class="header-actions">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="搜索车辆、设备...">
                </div>
                <div class="user-profile">
                    <i class="fas fa-bell"></i>
                    <span class="badge badge-danger">3</span>
                    <div class="avatar">
                        <i class="fas fa-user"></i>
                    </div>
                </div>
            </div>
        </header>
        
        <!-- 统计卡片区 -->
        <section class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon blue">
                    <i class="fas fa-bicycle"></i>
                </div>
                <div class="stat-info">
                    <span class="stat-label">总车辆</span>
                    <span class="stat-value" id="totalVehicles">24</span>
                    <span class="stat-trend up"><i class="fas fa-arrow-up"></i> +3</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon green">
                    <i class="fas fa-check-circle"></i>
                </div>
                <div class="stat-info">
                    <span class="stat-label">在线车辆</span>
                    <span class="stat-value" id="onlineVehicles">18</span>
                    <span class="stat-trend">75%</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon purple">
                    <i class="fas fa-vector-square"></i>
                </div>
                <div class="stat-info">
                    <span class="stat-label">围栏内车辆</span>
                    <span class="stat-value" id="inFenceVehicles">12</span>
                    <span class="stat-trend">正常</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon orange">
                    <i class="fas fa-triangle-exclamation"></i>
                </div>
                <div class="stat-info">
                    <span class="stat-label">今日报警</span>
                    <span class="stat-value" id="todayAlarms">5</span>
                    <span class="stat-trend warning">2条未处理</span>
                </div>
            </div>
        </section>
        
        <!-- 主要内容区 - 左右两列 -->
        <div class="content-grid">
            <!-- 左侧：车辆列表 -->
            <div class="panel vehicle-panel">
                <div class="panel-header">
                    <h3><i class="fas fa-list"></i> 车辆实时状态</h3>
                    <div class="panel-actions">
                        <button class="btn-icon" id="refreshVehiclesBtn">
                            <i class="fas fa-sync-alt"></i>
                        </button>
                        <button class="btn-icon">
                            <i class="fas fa-ellipsis-v"></i>
                        </button>
                    </div>
                </div>
                <div class="panel-body">
                    <div class="table-wrapper">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>车辆</th>
                                    <th>车牌号</th>
                                    <th>状态</th>
                                    <th>电量</th>
                                    <th>位置</th>
                                    <th>最后更新</th>
                                </tr>
                            </thead>
                            <tbody id="vehicleTableBody">
                                <!-- 动态渲染 -->
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="panel-footer">
                    <span>共 <span id="vehicleTableCount">24</span> 辆车</span>
                    <a href="admin.html" class="btn-link">管理车辆 <i class="fas fa-arrow-right"></i></a>
                </div>
            </div>
            
            <!-- 右侧：报警和围栏状态 -->
            <div class="right-column">
                <!-- 报警面板 -->
                <div class="panel alarm-panel">
                    <div class="panel-header">
                        <h3><i class="fas fa-bell"></i> 实时报警</h3>
                        <span class="badge badge-danger" id="alarmBadge">5</span>
                    </div>
                    <div class="panel-body">
                        <div class="alarm-list" id="alarmList">
                            <!-- 动态渲染 -->
                        </div>
                    </div>
                    <div class="panel-footer">
                        <button class="btn btn-outline btn-sm btn-block" id="clearAlarmsBtn">
                            <i class="fas fa-check-double"></i> 全部标记已读
                        </button>
                    </div>
                </div>
                
                <!-- 围栏摘要 -->
                <div class="panel fence-summary">
                    <div class="panel-header">
                        <h3><i class="fas fa-draw-polygon"></i> 电子围栏摘要</h3>
                        <a href="admin.html" class="btn-icon">
                            <i class="fas fa-external-link-alt"></i>
                        </a>
                    </div>
                    <div class="panel-body">
                        <div id="fenceSummaryContent">
                            <!-- 动态渲染 -->
                        </div>
                    </div>
                </div>
                
                <!-- 快速操作 -->
                <div class="quick-actions">
                    <a href="admin.html" class="action-card">
                        <i class="fas fa-pen"></i>
                        <span>绘制围栏</span>
                    </a>
                    <a href="parking.html" class="action-card">
                        <i class="fas fa-robot"></i>
                        <span>AI助手</span>
                    </a>
                    <a href="facilities.html" class="action-card">
                        <i class="fas fa-map"></i>
                        <span>设施地图</span>
                    </a>
                </div>
            </div>
        </div>
    </main>
    
    <!-- 通知容器 -->
    <div id="toastContainer" class="toast-container"></div>
    
    <!-- 脚本 -->
    <script src="js/core/config.js"></script>
    <script src="js/core/utils.js"></script>
    <script src="js/core/eventBus.js"></script>
    <script src="js/services/apiService.js"></script>
    <script src="js/services/websocketService.js"></script>
    <script src="js/modules/vehicleManager.js"></script>
    <script src="js/modules/fenceManager.js"></script>
    <script src="js/modules/alarmManager.js"></script>
    <script src="js/pages/dashboard.js"></script>
</body>
</html>
